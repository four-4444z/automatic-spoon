  <div class="main-content">
    <h1>SECURE CHAT TERMINAL</h1>
    
    <div id="chat-container" class="terminal-window" style="height: 400px; overflow-y: auto; border: 1px solid #00ff00; padding: 1rem; margin-bottom: 1rem; background: rgba(0, 20, 0, 0.9);">
      <div id="chat-output">
        <p style="color: #00ff00;">[ SYSTEM: SECURE CONNECTION ESTABLISHED ]</p>
        <p style="color: #00ff00;">[ STATUS: ENCRYPTION ACTIVE ]</p>
      </div>
    </div>

    <div class="chat-input-area" style="display: flex; gap: 10px;">
      <span style="color: #00ff00; align-self: center;">guest@core:~$</span>
      <input type="text" id="chat-input" placeholder="ENTER MESSAGE..." style="flex-grow: 1; background: transparent; border: 1px solid #00ff00; color: #00ff00; padding: 0.5rem; outline: none; font-family: 'Courier New', Courier, monospace;">
      <button id="send-btn" class="nav-btn">SEND</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const chatInput = document.getElementById('chat-input');
    const chatOutput = document.getElementById('chat-output');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(user, text, isSystem = false) {
      const p = document.createElement('p');
      if (isSystem) {
        p.style.color = '#00ff00';
        p.textContent = `[ ${text} ]`;
      } else {
        const time = new Date().toLocaleTimeString();
        p.innerHTML = `<span style="color: #888;">[${time}]</span> <span style="color: #00ff00;">${user}:</span> ${text}`;
      }
      chatOutput.appendChild(p);
      const container = document.getElementById('chat-container');
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      
      addMessage('YOU', text);
      chatInput.value = '';

      // Mock response for chat
      setTimeout(() => {
        const responses = [
          "MESSAGE RECEIVED. PROCESSING...",
          "ENCRYPTED PACKET SENT TO VAULT.",
          "SIGNAL STRENGTH NOMINAL.",
          "TRACE DEPLETED. ORIGIN MASKED.",
          "ACCESSING SECURE DATA STREAMS..."
        ];
        const randomResp = responses[Math.floor(Math.random() * responses.length)];
        addMessage('SYSTEM', randomResp, true);
      }, 1000);
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
