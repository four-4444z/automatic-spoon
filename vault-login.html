<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESTRICTED ACCESS</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body style="background-image: linear-gradient(rgba(255, 0, 0, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 0, 0.12) 1px, transparent 1px); background-size: 25px 25px; background-color: #050000; color: #ff0000; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
  <canvas id="matrix-canvas"></canvas>
  <div class="login-container" style="border-color: #ff0000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);">
    <h1 style="color: #ff0000;">VAULT ENTRANCE</h1>
    <div class="input-group">
      <label for="vault-pass" style="color: #ff0000;">ENCRYPTION KEY</label>
      <div class="password-container">
        <input type="password" id="vault-pass" style="border-color: #ff0000; color: #ff0000; background: #000;">
        <button type="button" class="toggle-password" style="color: #ff0000;">SHOW</button>
      </div>
    </div>
    <button id="vault-auth-btn" style="border-color: #ff0000; color: #ff0000;">AUTHORIZE</button>
    <div id="vault-feedback" style="margin-top: 1rem; text-align: center; color: #ff0000; font-size: 0.8rem;"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
