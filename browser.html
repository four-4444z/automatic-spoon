  <main class="main-content browser-page">
    <h1>WEB BROWSER</h1>
    <section class="browser-shell" aria-label="Web browser">
      <form class="browser-address-form" id="browser-address-form">
        <label class="sr-only" for="browser-address">Website address</label>
        <input
          id="browser-address"
          type="text"
          inputmode="url"
          placeholder="Enter a website address (https://example.com)"
          autocomplete="url"
          spellcheck="false"
          required
        >
        <button type="submit">Go</button>
      </form>
      <div class="browser-toolbar" aria-label="Browser controls">
        <button id="browser-back" type="button" aria-label="Go back" disabled>&larr;</button>
        <button id="browser-forward" type="button" aria-label="Go forward" disabled>&rarr;</button>
        <button id="browser-reload" type="button" aria-label="Reload page">&#8635;</button>
        <button id="browser-home" type="button" aria-label="Go to home page">Home</button>
        <span id="browser-status" role="status">Connecting to local proxy...</span>
      </div>
      <div class="browser-viewport">
        <iframe
          id="browser-frame"
          title="Web browser"
          sandbox="allow-forms allow-scripts"
          referrerpolicy="no-referrer"
        ></iframe>
      </div>
      <p class="browser-note">Local proxy · public HTTP/HTTPS sites · some sites may restrict embedding or proxy access.</p>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="browser.js"></script>
</body>
