<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choose the default search engine for CORE_SEARCH.">
  <title>SEARCH SETTINGS | CORE_SEARCH</title>
  <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body class="search-dashboard">
  <canvas id="matrix-canvas"></canvas>
  <nav class="navbar">
    <a class="nav-logo" href="main.html">CORE_SEARCH</a>
    <button class="menu-toggle" id="mobile-menu" aria-label="Toggle navigation" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <ul class="nav-links">
      <li><a href="main.html">SEARCH</a></li>
      <li><a href="browser.html">BROWSER</a></li>
      <li><a href="terminal.html">TERMINAL</a></li>
      <li><a href="settings.html" class="active">SETTINGS</a></li>
      <li><a href="theme.html">THEME</a></li>
      <li><a href="/logout">LOGOUT</a></li>
    </ul>
  </nav>

  <main class="settings-page">
    <a class="settings-back" href="main.html">&larr; BACK TO SEARCH</a>
    <section class="settings-panel">
      <p class="search-kicker"><span class="online-indicator"></span> PERSONALIZE YOUR EXPERIENCE</p>
      <h1>SEARCH SETTINGS</h1>
      <p class="settings-description">Choose where CORE_SEARCH sends your searches. Your preference is saved in this browser.</p>
      <form id="search-settings-form">
        <label class="settings-label" for="search-engine">DEFAULT SEARCH ENGINE</label>
        <select id="search-engine" name="search-engine">
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="google">Google</option>
          <option value="bing">Bing</option>
        </select>
        <button class="settings-save" type="submit">SAVE PREFERENCE</button>
        <p class="settings-feedback" id="settings-feedback" role="status" aria-live="polite"></p>
      </form>
      <a class="settings-theme-link" href="theme.html">CUSTOMIZE THEME &amp; APPEARANCE &rarr;</a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
