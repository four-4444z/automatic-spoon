<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUTUBE INTERFACE</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <style>
    .youtube-container {
      width: 100%;
      height: 85vh;
      border: 2px solid var(--primary-color);
      background: #000;
      position: relative;
      margin-top: 1rem;
    }
    .youtube-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .controls input {
      flex-grow: 1;
      max-width: 600px;
      background: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0.5rem;
      outline: none;
      font-family: 'Courier New', monospace;
    }
    .history-panel {
      margin-top: 1.5rem;
      border: 1px solid rgba(0, 255, 0, 0.3);
      padding: 1rem;
      background: rgba(0, 20, 0, 0.5);
      text-align: left;
    }
    .history-title {
      font-size: 0.8rem;
      color: #00ff00;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(0, 255, 0, 0.2);
      padding-bottom: 0.3rem;
      text-transform: uppercase;
    }
    .history-list {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .history-item {
      background: rgba(0, 255, 0, 0.1);
      border: 1px solid var(--primary-color);
      padding: 0.3rem 0.8rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .history-item:hover {
      background: var(--primary-color);
      color: #000;
    }
  </style>
</head>
<body>

  <div class="scanline"></div>
  <div class="grid"></div>
  
  <nav class="navbar">
    <div class="nav-logo">>_ SYSTEM_CORE</div>
    <div class="menu-toggle" id="mobile-menu">
      <span class="bar"></span>

      <span class="bar"></span>
    </div>
    <ul class="nav-links">

      <li><a href="about.html">ABOUT</a></li>
      <li><a href="index.html">LOGOUT</a></li>
    </ul>
  </nav>
  
  <div class="main-content">
    <h1>YOUTUBE MODULE</h1>
    
    <div class="controls">
      <input type="text" id="yt-url" placeholder="SEARCH OR ENTER VIDEO ID...">
      <button id="search-btn" class="nav-btn">SEARCH</button>
      <button id="load-btn" class="nav-btn">LOAD ID</button>
      <button id="yt-fullscreen-btn" class="nav-btn">FULLSCREEN</button>
    </div>

    <div class="youtube-container" id="yt-container">
      <iframe id="yt-frame" class="youtube-frame" src="https://www.youtube-nocookie.com/embed?rel=0" allowfullscreen></iframe>
    </div>
    <p id="yt-watch-fallback" hidden style="margin-top: 0.75rem;">
      <a id="yt-watch-link" class="nav-btn" target="_blank" rel="noopener noreferrer">WATCH ON YOUTUBE</a>
    </p>

    <div class="history-panel">
      <div class="history-title">SESSION TRANSMISSIONS (CLICK TO LOAD)</div>
      <div id="history-list" class="history-list">
        <!-- History items will appear here -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const ytInput = document.getElementById('yt-url');
    const searchBtn = document.getElementById('search-btn');
    const loadBtn = document.getElementById('load-btn');
    const fullBtn = document.getElementById('yt-fullscreen-btn');
    const ytFrame = document.getElementById('yt-frame');
    const ytContainer = document.getElementById('yt-container');
    const watchFallback = document.getElementById('yt-watch-fallback');
    const watchLink = document.getElementById('yt-watch-link');
    const historyList = document.getElementById('history-list');

    let videoHistory = JSON.parse(localStorage.getItem('yt_history') || '[]');

    function updateHistoryUI() {
      historyList.innerHTML = '';
      videoHistory.forEach(id => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.textContent = id;
        div.onclick = () => loadVideo(id);
        historyList.appendChild(div);
      });
    }

    function loadVideo(forcedId = null) {
      let val = forcedId || ytInput.value.trim();
      if (!val) return;

      let videoId = '';
      if (val.includes('v=')) {
        videoId = val.split('v=')[1].split('&')[0];
      } else if (val.includes('youtu.be/')) {
        videoId = val.split('youtu.be/')[1].split('?')[0];
      } else if (val.includes('shorts/')) {
        videoId = val.split('shorts/')[1].split('?')[0];
      } else if (val.includes('embed/')) {
        videoId = val.split('embed/')[1].split('?')[0];
      } else {
        videoId = val; 
      }

      if (videoId && videoId.length === 11) {
        ytFrame.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&showinfo=0`;
        watchLink.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
        watchFallback.hidden = false;
        
        if (!videoHistory.includes(videoId)) {
          videoHistory.unshift(videoId);
          if (videoHistory.length > 10) videoHistory.pop();
          localStorage.setItem('yt_history', JSON.stringify(videoHistory));
          updateHistoryUI();
        }
      }
    }

    function browseVideos() {
      let query = ytInput.value.trim();
      if (!query) return;
      const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
      window.open(searchUrl, '_blank', 'noopener,noreferrer');
    }

    searchBtn.addEventListener('click', browseVideos);
    loadBtn.addEventListener('click', () => loadVideo());
    
    ytInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const val = ytInput.value.trim();
        if (val.includes('youtube.com') || val.includes('youtu.be') || (val.length === 11 && !val.includes(' '))) {
          loadVideo();
        } else {
          browseVideos();
        }
      }
    });

    fullBtn.addEventListener('click', () => {
      if (ytContainer.requestFullscreen) {
        ytContainer.requestFullscreen();
      } else if (ytContainer.webkitRequestFullscreen) {
        ytContainer.webkitRequestFullscreen();
      }
    });

    updateHistoryUI();
  </script>
</body>
</html>
