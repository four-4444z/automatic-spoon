<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personalize the CORE_SEARCH accent color and appearance.">
  <title>THEME | CORE_SEARCH</title>
  <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body class="search-dashboard">
  <canvas id="matrix-canvas"></canvas>
  <nav class="navbar">
    <a class="nav-logo" href="main.html">CORE_SEARCH</a>
    <button class="menu-toggle" id="mobile-menu" aria-label="Toggle navigation" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <ul class="nav-links">
      <li><a href="main.html">SEARCH</a></li>
      <li><a href="browser.html">BROWSER</a></li>
      <li><a href="terminal.html">TERMINAL</a></li>
      <li><a href="settings.html">SETTINGS</a></li>
      <li><a href="theme.html" class="active">THEME</a></li>
      <li><a href="/logout">LOGOUT</a></li>
    </ul>
  </nav>

  <main class="settings-page">
    <a class="settings-back" href="main.html">&larr; BACK TO SEARCH</a>
    <section class="settings-panel theme-panel">
      <p class="search-kicker"><span class="online-indicator"></span> MAKE IT YOURS</p>
      <h1>THEME &amp; APPEARANCE</h1>
      <p class="settings-description">Choose an accent color and the appearance that feels right for you.</p>

      <form id="theme-form">
        <fieldset class="theme-fieldset">
          <legend class="settings-label">ACCENT COLOR</legend>
          <div class="theme-swatches" role="group" aria-label="Preset accent colors">
            <button class="theme-swatch" type="button" data-color="#ff5c67" aria-label="Red" aria-pressed="false" style="--swatch-color: #ff5c67"><span>Red</span></button>
            <button class="theme-swatch" type="button" data-color="#ff9c4a" aria-label="Orange" aria-pressed="false" style="--swatch-color: #ff9c4a"><span>Orange</span></button>
            <button class="theme-swatch" type="button" data-color="#ffd45c" aria-label="Yellow" aria-pressed="false" style="--swatch-color: #ffd45c"><span>Yellow</span></button>
            <button class="theme-swatch" type="button" data-color="#61f99b" aria-label="Green" aria-pressed="false" style="--swatch-color: #61f99b"><span>Green</span></button>
            <button class="theme-swatch" type="button" data-color="#64a8ff" aria-label="Blue" aria-pressed="false" style="--swatch-color: #64a8ff"><span>Blue</span></button>
            <button class="theme-swatch" type="button" data-color="#b18cff" aria-label="Purple" aria-pressed="false" style="--swatch-color: #b18cff"><span>Purple</span></button>
            <button class="theme-swatch" type="button" data-color="#ff75be" aria-label="Pink" aria-pressed="false" style="--swatch-color: #ff75be"><span>Pink</span></button>
          </div>
          <label class="settings-label custom-color-label" for="theme-hex">OR ENTER A HEX COLOR</label>
          <div class="custom-color-row">
            <input id="theme-hex" name="theme-hex" type="text" value="#61f99b" maxlength="7" pattern="^#[0-9a-fA-F]{6}$" placeholder="#61f99b" autocomplete="off" spellcheck="false" aria-describedby="theme-hex-help">
            <input id="theme-color-picker" type="color" value="#61f99b" aria-label="Choose a custom color">
          </div>
          <p id="theme-hex-help" class="theme-help">Use the format #RRGGBB.</p>
        </fieldset>

        <fieldset class="theme-fieldset appearance-fieldset">
          <legend class="settings-label">APPEARANCE</legend>
          <div class="appearance-options">
            <label class="appearance-option">
              <input type="radio" name="appearance" value="dark">
              <span><strong>Dark</strong><small>Matrix after hours</small></span>
            </label>
            <label class="appearance-option">
              <input type="radio" name="appearance" value="light">
              <span><strong>Light</strong><small>Bright and clear</small></span>
            </label>
            <label class="appearance-option">
              <input type="radio" name="appearance" value="system">
              <span><strong>System</strong><small>Follow your device</small></span>
            </label>
          </div>
        </fieldset>

        <button class="settings-save" type="submit">APPLY THEME</button>
        <p class="settings-feedback" id="theme-feedback" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
